name: ci

# Offline tests for the engine, checker, API and fairness audit. No API key and no
# secrets. The processed table is git-ignored, so it is rebuilt here from the
# committed official documents in data/raw (about 80 seconds). The live-API
# commands (copilot.evaluate, copilot.tone_check) spend quota and are not run here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the Dockerfile uses 3.11
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the processed table from data/raw
        run: |
          python -m copilot.data.ingest
          python -m copilot.data.validate

      - name: Tests (offline)
        run: python -m pytest -q -rs
